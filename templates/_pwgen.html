{# 密码生成器（列表页的「改密码」弹窗和账号表单共用）。
   全部在浏览器里用 crypto.getRandomValues 生成，不经过服务器。 #}
<script>
window.PwGen = (function(){
  'use strict';
  var SETS = {
    lower:   'abcdefghijklmnopqrstuvwxyz',
    upper:   'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    digits:  '0123456789',
    // 只用各家网站普遍接受的符号，免得生成的密码被官网拒绝
    symbols: '!@#$%^&*-_=+?'
  };
  var PREF_KEY = 'totp-share.pwgen';
  var DEFAULTS = { length: 20, digits: true, symbols: true };
  var MIN_LENGTH = 8, MAX_LENGTH = 64;

  // 0 ≤ 返回值 < n 的均匀随机整数。用拒绝采样去掉取模带来的偏差。
  function randInt(n){
    var limit = Math.floor(0x100000000 / n) * n, buf = new Uint32Array(1);
    do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
    return buf[0] % n;
  }
  function pick(chars){ return chars.charAt(randInt(chars.length)); }

  function normalize(opts){
    var o = {
      length: parseInt(opts && opts.length, 10),
      digits: !(opts && opts.digits === false),
      symbols: !(opts && opts.symbols === false)
    };
    if (!isFinite(o.length)) o.length = DEFAULTS.length;
    o.length = Math.min(MAX_LENGTH, Math.max(MIN_LENGTH, o.length));
    return o;
  }

  function generate(opts){
    var o = normalize(opts);
    var required = [SETS.lower, SETS.upper];
    if (o.digits) required.push(SETS.digits);
    if (o.symbols) required.push(SETS.symbols);
    var all = required.join('');
    // 每类字符先各放一个（很多网站要求"必须包含数字/符号"），其余位置从全部字符里取，最后整体洗牌
    var chars = required.map(pick);
    while (chars.length < o.length) chars.push(pick(all));
    for (var i = chars.length - 1; i > 0; i--) {
      var j = randInt(i + 1), t = chars[i]; chars[i] = chars[j]; chars[j] = t;
    }
    return chars.join('');
  }

  function loadPrefs(){
    try { return normalize(JSON.parse(localStorage.getItem(PREF_KEY) || '{}')); }
    catch (e) { return normalize(DEFAULTS); }
  }
  function savePrefs(opts){
    try { localStorage.setItem(PREF_KEY, JSON.stringify(normalize(opts))); } catch (e) {}
  }

  return { generate: generate, loadPrefs: loadPrefs, savePrefs: savePrefs,
           MIN_LENGTH: MIN_LENGTH, MAX_LENGTH: MAX_LENGTH };
})();
</script>
