{% extends "base.html" %}
{% block title %}管理员登录{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5"><div class="col-md-5">
 <div class="card p-4">
  <h4 class="mb-3">管理员登录</h4>
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
  <form method="post">
   <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
   <div class="mb-3"><label class="form-label">用户名</label>
    <input class="form-control" name="username" autocomplete="username" required autofocus></div>
   <div class="mb-3"><label class="form-label">密码</label>
    <input class="form-control" type="password" name="password" autocomplete="current-password" required></div>
   <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" name="remember" id="remember" checked>
    <label class="form-check-label" for="remember">记住这台设备，30 天内打开直接进入</label>
    <div class="form-text">在公共电脑或别人的电脑上请取消勾选。修改管理员密码会让所有记住的设备退出。</div>
   </div>
   <button class="btn btn-primary w-100">登录</button>
  </form>
 </div>
</div></div>
{% endblock %}
