{% extends "base.html" %}
{% block title %}管理员登录{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5"><div class="col-md-5">
 <div class="card p-4">
  <h4 class="mb-3">管理员登录</h4>
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
  <form method="post">
   <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
   <div class="mb-3"><label class="form-label">用户名</label>
    <input class="form-control" name="username" required autofocus></div>
   <div class="mb-3"><label class="form-label">密码</label>
    <input class="form-control" type="password" name="password" required></div>
   <button class="btn btn-primary w-100">登录</button>
  </form>
 </div>
</div></div>
{% endblock %}
