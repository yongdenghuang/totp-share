{% extends "base.html" %}
{% block title %}{{ name }} — 需要密码{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
 <div class="card p-4">
  <h5 class="mb-3">🔒 {{ name }}</h5>
  <p class="text-muted small">此分享链接受密码保护，请输入密码以查看 TOTP 验证码。</p>
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
  <form method="post">
   <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
   <div class="mb-3"><input class="form-control form-control-lg text-center" type="password" name="password" autofocus required></div>
   <button class="btn btn-primary w-100 btn-lg">进入</button>
  </form>
 </div>
</div></div>
{% endblock %}
